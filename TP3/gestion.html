<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Multirubro El Sol</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4-_7xQ8AdCR8BkZI957A3V023B4O54EI5lw&s" alt="Logo Multirubro El Sol" width="80">
            <h1>Multirubro El Sol</h1>
        </div>
    </header>

    <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="gestion.html" class="active">Gestión de Productos</a>
        <a href="ventas.html">Ventas</a>
    </nav>

    <main class="container">
        <section class="form-section">
            <h2>Agregar / Editar Producto</h2>
            <form class="producto-form">
                <div class="form-group">
                    <label for="nombre">Nombre del producto:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Alfajor Jorgito">
                </div>

                <div class="form-group">
                    <label for="rubro">Rubro:</label>
                    <select id="rubro" name="rubro" required>
                        <option value="">Seleccionar rubro</option>
                        <option value="kiosco">Kiosco</option>
                        <option value="libreria">Librería</option>
                        <option value="regaleria">Regalería</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" name="precio" min="1" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" name="stock" min="0" required>
                </div>

                <button type="submit" class="btn-guardar">Guardar Producto</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Multirubro El Sol</p>
    </footer>
</body>
</html>
